services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      BAYES_DB_PATH: /data/bayesdiag.db
    volumes:
      - bayes-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  bayes-data:
